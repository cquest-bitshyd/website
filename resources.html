<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | c-QUEST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #0f172a; }
        .resource-card {
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .resource-card:hover {
            border-color: #ef4444;
            transform: translateY(-2px);
        }
        .resource-card.active {
            border-color: #ef4444;
            background-color: rgba(30, 41, 59, 0.9);
        }
    </style>
</head>
<body class="antialiased text-slate-200">

    <!-- Navigation Header -->
    <header id="header" class="bg-black/30 backdrop-blur-lg sticky top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-white">
                c<span class="text-red-500"> -QUEST</span>
            </a>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html#home" class="text-slate-300 hover:text-white">Home</a>
                <a href="colloquium.html" class="text-slate-300 hover:text-white">Activities</a>
                <a href="resources.html" class="text-red-400 font-bold">Resources</a>
                <a href="index.html#faculty" class="text-slate-300 hover:text-white">Faculty</a>
                <a href="index.html#contact" class="text-slate-300 hover:text-white">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div class="mb-10 text-center flex flex-col items-center">
            <span class="text-red-500 font-semibold tracking-wider uppercase text-sm"> Learning Resources</span>
            <h1 class="text-4xl font-extrabold text-white mt-1"> Quantum 101 </h1>
        </div>

        <!-- Topic Section: Quantum 101 -->
        <section class="mb-12">
            <div class="border-b border-slate-700 pb-4 mb-6 text-center">
                <h2 class="text-2xl font-bold text-white flex items-center justify-centre gap-3">
                    
                </h2>
                <p class="text-slate-400 text-sm mt-1">Essential introductory reading materials.</p>
            </div>

            <!-- Content Area: List on Left, PDF Preview on Right -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- PDF List (5 Documents) -->
                <div class="lg:col-span-4 space-y-3" id="pdf-list-container">
                    <!-- Dynamic JavaScript Rendering -->
                </div>

                <!-- Browser Native PDF Renderer Panel -->
                <div class="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-col h-[750px]">
                    <div class="flex justify-between items-center px-4 py-2 bg-slate-950 rounded mb-2">
                        <span id="active-doc-title" class="text-sm font-semibold text-slate-300 truncate">Select a PDF to view</span>
                        <a id="download-doc-btn" href="#" target="_blank" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded transition">
                            Open Direct
                        </a>
                    </div>
                    
                    <!-- Native Browser PDF Embedder -->
                    <div class="flex-grow w-full bg-slate-950 rounded overflow-hidden">
                        <iframe id="pdf-viewer" class="w-full h-full border-0" src="" title="PDF Viewer"></iframe>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        // Metadata Pointer Store (Can also be fetched dynamically from your Google Sheet API/CSV)
        const pdfMetadataStore = [
            {
                id: 1,
                title: "101 A. From Classical Certainty to Quantum Possibility",
              
                drive_url: "https://drive.google.com/file/d/16Ve_wBx1cOLxxQ2Ue_zCO1KghGk0bZBU/view?usp=share_link" 
            },
            {
                id: 2,
                title: "101 B. Entanglement in Composite Quantum Systems  ",
               
                drive_url: "https://drive.google.com/file/d/1sTp0QQHl4ZVsTIRqzP5GWpFmnbKiJjfR/view?usp=share_link"
            },
            {
                id: 3,
                title: "101 C. ",
             
                drive_url: "https://drive.google.com/file/d/1ExampleDriveID_3/view"
            },
            {
                id: 4,
                title: "101 D. ",
             
                drive_url: "https://drive.google.com/file/d/1ExampleDriveID_4/view"
            },
            {
                id: 5,
                title: "101 E. ",
                
                drive_url: "https://drive.google.com/file/d/1ExampleDriveID_5/view"
            }
        ];

        // Convert regular Google Drive URL to an embeddable preview link
        function getEmbeddableDriveUrl(url) {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }
            return url; // Fallback if direct raw URL is supplied
        }

        function loadPdfIntoViewer(doc) {
            const iframe = document.getElementById('pdf-viewer');
            const titleEl = document.getElementById('active-doc-title');
            const downloadBtn = document.getElementById('download-doc-btn');

            titleEl.textContent = doc.title;
            downloadBtn.href = doc.drive_url;
            iframe.src = getEmbeddableDriveUrl(doc.drive_url);

            // Highlight active selection
            document.querySelectorAll('.resource-card').forEach(card => card.classList.remove('active'));
            const activeCard = document.getElementById(`doc-card-${doc.id}`);
            if (activeCard) activeCard.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('pdf-list-container');

            // Render list of 5 PDF items
            pdfMetadataStore.forEach((doc, index) => {
                const card = document.createElement('div');
                card.id = `doc-card-${doc.id}`;
                card.className = 'resource-card p-4 rounded-lg cursor-pointer flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-white text-base leading-snug">${doc.title}</h3>
                        
                    </div>
                    <div class="mt-3 flex items-center text-xs text-red-400 font-medium">
                        <span>Click to Preview</span>
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                `;

                card.addEventListener('click', () => loadPdfIntoViewer(doc));
                listContainer.appendChild(card);
            });

            // Automatically load the first PDF on page load
            if (pdfMetadataStore.length > 0) {
                loadPdfIntoViewer(pdfMetadataStore[0]);
            }
        });
    </script>
</body>
</html>
